<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#008080" />
  <meta name="description" content="NoteKeep 98 — a Windows 95/98-inspired notes app built with Bun and TypeScript." />
  <title>NoteKeep 98</title>
  <style>
:root {

* { box-sizing: border-box; }

[hidden] { display:none!important; }
#app { position:relative; isolation:isolate; }
.desktop { height:100%; width:100%; padding:30px 40px 50px 98px; display:flex; justify-content:center; align-items:center; background:var(--desktop); background-image: radial-gradient(rgba(255,255,255,.09) .7px,transparent .7px); background-size:5px 5px; }

.desktop-shortcut svg { width:34px; height:34px; filter:drop-shadow(2px 2px 0 #004d4d); }
.window { background:var(--face); padding:3px; border:1px solid; border-color:var(--light) var(--dark) var(--dark) var(--light); box-shadow:inset 1px 1px 0 var(--light2), inset -1px -1px 0 var(--shadow), 2px 2px 0 rgba(0,0,0,.15); }

.note-window { background:var(--face); border:1px solid; border-color:#fff #000 #000 #fff; box-shadow:inset 1px 1px var(--light2),inset -1px -1px var(--shadow),2px 2px 0 rgba(0,0,0,.06); min-width:0; position:relative; padding:3px; }

.field { margin-bottom:15px; }

    const value = button.getAttribute('data-value') ?? '';
    switch (action) {
        case 'menu':
            openPopup(value, null, button);
            break;
        case 'start':
            openPopup('start', null, button);
            break;
        case 'popup':
            openPopup(button.getAttribute('data-kind'), noteId, button);
            break;
        case 'view':
            setView(button.getAttribute('data-view') || 'notes');
            break;
        case 'newNote':
            openEditor(null, false);
            break;
        case 'newChecklist':
            openEditor(null, true);
            break;
        case 'editNote': {
            const n = getNote(noteId);
            if (n && !n.trashed)
                openEditor(n);
            break;
        }
        case 'saveEditor':
            saveEditor();
            break;
        case 'cancelEditor':
            closeEditor();
            break;
        case 'closeDialog':
            dialog = null;
            closePopup();
            renderDialog();
            break;
        case 'manageLabels':
            dialog = 'labels';
            closePopup();
            renderDialog();
            break;
        case 'settings':
            dialog = 'settings';
            closePopup();
            renderDialog();
            break;
        case 'about':
            dialog = 'about';
            closePopup();
            renderDialog();
            break;
        case 'addLabel': {
            const input = $('#newLabelInput');
            const name = input?.value.trim();
            if (!name)
                return;
            if (data.labels.some(l => l.toLowerCase() === name.toLowerCase())) {
                notify('That label already exists');
                return;
            }
            mutate(() => data.labels.push(name));
            renderDialog();
            $('#newLabelInput')?.focus();
            notify('Label created');
            break;
        }
        case 'renameLabel':
            renameLabel(value);
            break;
        case 'deleteLabel':
            confirm('Delete label?', `Remove the “${value}” label from all notes? The notes will remain.`, () => { mutate(() => { data.labels = data.labels.filter(l => l !== value); for (const n of data.notes)
                n.labels = n.labels.filter(l => l !== value); if (view === `label:${value}`)
                view = 'notes'; }); dialog = 'labels'; renderDialog(); notify('Label deleted'); });
            break;
        case 'chooseColor': {
            updateTarget(n => n.color = value);
            if (popup.target === 'draft') {
                $('#editorPaper')?.style.setProperty('--note-color', value);
            }
            closePopup();
            break;
        }
        case 'pin':
            updateTarget(n => n.pinned = !n.pinned, noteId);
            break;
        case 'toggleDraftPin':
            if (draft) {
                syncDraft();
                draft.pinned = !draft.pinned;
                renderDialog();
            }
            break;
        case 'toggleDraftChecklist':
            if (draft) {
                syncDraft();
                draft.checklist = !draft.checklist;
                if (draft.checklist && !draft.items.length)
                    draft.items.push({ id: id(), text: '', checked: false });
                renderDialog();
            }
            break;
        case 'addItem':
            if (draft) {
                syncDraft();
                draft.items.push({ id: id(), text: '', checked: false });
                renderDialog();
                $('.editor-check-row:last-child .item-text')?.focus();
            }
            break;
        case 'removeItem':
            if (draft) {
                syncDraft();
                draft.items = draft.items.filter(i => i.id !== button.getAttribute('data-item'));
                renderDialog();
            }
            break;
        case 'reminder':
            openReminder(noteId);
            break;
        case 'closeReminder':
            closeReminder();
            break;
        case 'saveReminder': {
            const d = $('#reminderDate')?.value;
            const t = $('#reminderTime')?.value;
            if (!d || !t) {
                notify('Choose a date and time');
                break;
            }
            const stamp = new Date(`${d}T${t}`);
            if (Number.isNaN(stamp.getTime())) {
                notify('Invalid reminder date');
                break;
            }
            setReminder(stamp.toISOString());
            break;
        }
        case 'removeReminder':
            setReminder(null);
            break;
        case 'archive':
            mutationWithUndo('Note moved', () => { const n = getNote(noteId); if (n) {
                n.archived = !n.archived;
                n.updatedAt = now();
            } });
            closePopup();
            break;
        case 'delete':
            mutationWithUndo('Moved to Recycle Bin', () => { const n = getNote(noteId); if (n) {
                n.trashed = true;
                n.archived = false;
                n.updatedAt = now();
            } });
            closePopup();
            break;
        case 'restore':
            mutationWithUndo('Note restored', () => { const n = getNote(noteId); if (n) {
                n.trashed = false;
                n.updatedAt = now();
            } });
            break;
        case 'deleteForever':
            confirm('Delete permanently?', 'This note will be removed permanently. This action cannot be undone.', () => { mutate(() => data.notes = data.notes.filter(n => n.id !== noteId)); dialog = null; renderDialog(); notify('Note deleted permanently'); });
            break;
        case 'emptyTrash':
            confirm('Empty Recycle Bin?', 'All notes in the Recycle Bin will be permanently deleted. This cannot be undone.', () => { mutate(() => data.notes = data.notes.filter(n => !n.trashed)); dialog = null; renderDialog(); notify('Recycle Bin emptied'); });
            break;
        case 'duplicate': {
            const n = getNote(popup.target ?? '');
            if (n) {
                const copy = structuredClone(n);
                copy.id = id();
                copy.title = n.title;
                copy.createdAt = now();
                copy.updatedAt = now();
                copy.pinned = false;
                copy.items = copy.items.map(i => ({ ...i, id: id() }));
                mutate(() => data.notes.unshift(copy));
                notify('Note duplicated');
            }
            closePopup();
            break;
        }
        case 'export':
            closePopup();
            exportData();
            break;
        case 'import':
            closePopup();
            $('#importInput')?.click();
            break;
        case 'reset':
            confirm('Restore sample notes?', 'This replaces all your notes and labels with the sample set. Export a JSON backup first if you want to keep your notes.', () => { data = seed(); persist(); dialog = null; view = 'notes'; search = ''; const field = $('#searchInput'); if (field)
                field.value = ''; renderDialog(); render(); notify('Sample notes restored'); });
            break;
        case 'confirm': {
            const fn = confirmAction;
            confirmAction = null;
            dialog = null;
            renderDialog();
            fn?.();
            break;
        }
        case 'toggleView':
            mutate(() => { data.list = !data.list; });
            closePopup();
            break;
        case 'toggleNight':
            mutate(() => { data.dark = !data.dark; });
            closePopup();
            if (dialog === 'settings')
                renderDialog();
            break;
        case 'toggleListFromSettings':
            mutate(() => { data.list = !data.list; });
            renderDialog();
            break;
        case 'clearSearch':
            search = '';
            {
                const field = $('#searchInput');
                if (field) {
                    field.value = '';
                    field.focus();
                }
            }
            render();
            break;
        case 'dismissToast': {
            const root = $('#toastRoot');
            if (root)
                root.innerHTML = '';
            break;
        }
        case 'undo':
            if (undo) {
                data.notes = undo;
                undo = null;
                persist();
                render();
                notify('Undone');
            }
            break;
        case 'minimize':
            minimized = true;
            mobileMenu = false;
            closePopup();
            render();
            break;
        case 'maximize':
            maximized = !maximized;
            render();
            break;
        case 'taskApp':
            minimized = !minimized;
            render();
            break;
        case 'reopen':
            minimized = false;
            setView(button.getAttribute('data-view') || 'notes');
            render();
            break;
        case 'toggleNav':
            mobileMenu = !mobileMenu;
            render();
            break;
        case 'closeNav':
            mobileMenu = false;
            render();
            break;
    }
}
app.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (button) {
        const action = button.getAttribute('data-action') ?? '';
        if (['toggleLabel', 'checkItem', 'toggleNight', 'toggleListFromSettings'].includes(action) && button.matches('input'))
            return;
        if (action === 'backdrop')
            return;
        execute(action, button);
    }
    else if (popup.kind && !event.target.closest('.popup,.start-menu'))
        closePopup();
});
app.addEventListener('change', event => {
    const node = event.target;
    const input = node;
    const action = node.getAttribute('data-action');
    if (action === 'checkItem') {
        const noteId = node.getAttribute('data-id') ?? '';
        const itemId = node.getAttribute('data-item') ?? '';
        mutate(() => { const item = getNote(noteId)?.items.find(i => i.id === itemId); if (item)
            item.checked = input.checked; });
    }
    if (action === 'toggleLabel') {
        const label = node.getAttribute('data-value') ?? '';
        updateTarget(n => { n.labels = input.checked ? [...new Set([...n.labels, label])] : n.labels.filter(l => l !== label); });
        renderPopup();
    }
    if (action === 'toggleNight') {
        data.dark = input.checked;
        persist();
        render();
    }
    if (action === 'toggleListFromSettings') {
        data.list = input.checked;
        persist();
        render();
    }
});
app.addEventListener('input', event => {
    const node = event.target;
    if (node.id === 'searchInput') {
        search = node.value;
        render();
    }
});
app.addEventListener('keydown', event => {
    const node = event.target;
    if (node.matches('[data-action="editNote"]') && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        execute('editNote', node);
    }
    if (node.id === 'newLabelInput' && event.key === 'Enter') {
        event.preventDefault();
        execute('addLabel', node);
    }
});
document.addEventListener('click', event => {
    const target = event.target;
    if (popup.kind && !target.closest('#popupRoot') && !target.closest('[data-action="popup"],[data-action="menu"],[data-action="start"]'))
        closePopup();
});
document.addEventListener('keydown', event => {
    const focused = event.target;
    const typing = ['INPUT', 'TEXTAREA'].includes(focused?.tagName) || focused?.isContentEditable;
    if (event.key === 'Escape') {
        if (popup.kind) {
            closePopup();
            return;
        }
        if (dialog === 'reminder') {
            closeReminder();
            return;
        }
        if (dialog === 'editor') {
            closeEditor();
            return;
        }
        if (dialog) {
            dialog = null;
            renderDialog();
            return;
        }
        if (mobileMenu) {
            mobileMenu = false;
            render();
            return;
        }
        if (search) {
            search = '';
            const f = $('#searchInput');
            if (f)
                f.value = '';
            render();
        }
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        $('#searchInput')?.focus();
    }
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && dialog === 'editor') {
        event.preventDefault();
        saveEditor();
    }
    if (!dialog && !typing && !event.altKey && !event.ctrlKey && !event.metaKey && event.key.toLowerCase() === 'n') {
        event.preventDefault();
        openEditor(null);
    }
});
const importInput = $('#importInput');
if (importInput)
    importInput.addEventListener('change', async () => {
        const file = importInput.files?.[0];
        if (!file)
            return;
        try {
            const parsed = JSON.parse(await file.text());
            if (!parsed || typeof parsed !== 'object' || !('notes' in parsed) || !Array.isArray(parsed.notes) || parsed.notes.length > 5000)
                throw new Error('Invalid file');
            const incoming = parsed.notes.map(normalizeNote);
            const used = new Set(data.notes.map(n => n.id));
            incoming.forEach(n => { if (used.has(n.id))
                n.id = id(); used.add(n.id); });
            const labels = ('labels' in parsed && Array.isArray(parsed.labels)) ? parsed.labels.filter((x) => typeof x === 'string').slice(0, 200) : [];
            mutate(() => { data.notes.unshift(...incoming); data.labels = Array.from(new Set([...data.labels, ...labels, ...incoming.flatMap(n => n.labels)])).slice(0, 200); });
            dialog = null;
            renderDialog();
            notify(`${incoming.length} notes imported`);
        }
        catch {
            notify('Invalid JSON notes backup');
        }
        importInput.value = '';
    });
setWindowClock();
window.setInterval(setWindowClock, 30000);
render();

</script>
</body>
</html>
