name: keep UI verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, and Chromium browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bun dependencies and check TypeScript
        run: |
          bun install
          bun run typecheck
          bun test tests/sync-merge.test.ts tests/sync-database.test.ts
          bun run build
          bun build tests/sync-storage-browser.ts --target browser --outfile dist/sync-storage-test.js
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3000 bun run start > /tmp/keep-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/keep-server.log; exit 1; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/ > /dev/null
          python tests/browser_test.py
          python tests/sync_storage_test.py
      - name: Run the same browser tests under the GitHub Pages subpath
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/keep-pages/keep
          cp -a dist/. /tmp/keep-pages/keep/
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/keep-pages > /tmp/keep-pages.log 2>&1 &
          PAGES_PID=$!
          trap 'kill "$PAGES_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/keep/; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/keep/app.js > /dev/null
          curl --fail http://127.0.0.1:8765/keep/style.css > /dev/null
          curl --fail http://127.0.0.1:8765/keep/theme-signal.js > /dev/null
          curl --fail http://127.0.0.1:8765/keep/config.css > /dev/null
          KEEP_BASE_URL=http://127.0.0.1:8765/keep/ python tests/browser_test.py
      - name: Verify two-device cloud synchronization and revocation
        if: always() && !cancelled()
        shell: bash
        env:
          KEEP_CLOUD_ENABLED: 'true'
          KEEP_ORIGIN: http://127.0.0.1:3010
          KEEP_CREATE_INVITE: local-ci-invitation-not-a-production-secret
          KEEP_DATABASE_PATH: /tmp/keep-cloud-ci.sqlite
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3010 bun run start > /tmp/keep-cloud-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3010/health; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/keep-cloud-ci.log; exit 1; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3010/health
          python tests/cloud_sync_browser_test.py
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-browser-evidence
          path: |
            test-results/
          if-no-files-found: ignore
