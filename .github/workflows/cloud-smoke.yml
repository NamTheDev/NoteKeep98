name: Cloud public endpoint smoke check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS, cloud feature marker and authentication
        shell: bash
        run: |
          set -euo pipefail
          url=https://keep-sync-production.up.railway.app
          curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 -fsS "$url/health" | grep -qx ok
          curl --max-time 15 -fsS "$url/" | grep -q 'name="keep-cloud" content="enabled"'
          test "$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' "$url/api/v1/session")" = 401
          test "$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' -X POST "$url/api/v1/workspaces" -H 'Content-Type: application/json' -d '{}')" = 403
          echo 'Public HTTPS and authorization smoke checks passed.'
