name: Cloud public endpoint smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Pages frontend and Railway API
        shell: bash
        run: |
          set -euo pipefail
          api=https://keep-sync-production.up.railway.app
          site=https://namthedev.github.io/keep/
          origin=https://namthedev.github.io
          for i in {1..36}; do
            if curl -fsS "$site?smoke=$RANDOM" | grep -q 'name="keep-cloud" content="https://keep-sync-production.up.railway.app"' &&
               curl -fsSI "$api/" | grep -qi "location: $site" &&
               curl -fsS "$api/health" | grep -qx ok &&
               test "$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $origin" "$api/api/v1/session")" = 401; then break; fi
            sleep 5
          done
          curl -fsS "$site?smoke=$RANDOM" | grep -q 'name="keep-cloud" content="https://keep-sync-production.up.railway.app"'
          curl -fsSI "$api/" | grep -qi "location: $site"
          curl -fsS "$api/health" | grep -qx ok
          curl -fsS -D /tmp/keep-cors -o /dev/null -X OPTIONS "$api/api/v1/workspaces" -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-keep-request'
          grep -qi "access-control-allow-origin: $origin" /tmp/keep-cors
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $origin" "$api/api/v1/session")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://example.com' "$api/api/v1/session")" = 403
